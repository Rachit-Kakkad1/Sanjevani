openapi: 3.0.0
info:
  title: Sanjevani API
  description: API for medical bill auditing and Jan Aushadhi store finding
  version: 1.0.0
paths:
  /api/v1/auth/google:
    post:
      summary: Authenticate with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Google OAuth Token
      responses:
        '200':
          description: Successfully authenticated
        '400':
          description: Validation error (e.g. missing token)
        '429':
          description: Too many requests (Rate limited to 5 per 15 min)

  /api/v1/stores:
    post:
      summary: Create a Jan Aushadhi Store
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - location
                - address
                - state
                - district
                - pincode
              properties:
                name:
                  type: string
                location:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [Point]
                      default: Point
                    coordinates:
                      type: array
                      items:
                        type: number
                      minItems: 2
                      maxItems: 2
                address:
                  type: string
                state:
                  type: string
                district:
                  type: string
                pincode:
                  type: string
      responses:
        '201':
          description: Store created successfully
        '400':
          description: Validation Error
        '401':
          description: Unauthorized (Missing or invalid token)
        '403':
          description: Forbidden (Not an admin)

  /api/v1/stores/nearby:
    get:
      summary: Find nearby stores
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
        - in: query
          name: lng
          required: true
          schema:
            type: number
        - in: query
          name: maxDistance
          schema:
            type: integer
            default: 10000
      responses:
        '200':
          description: List of stores
        '400':
          description: Missing lat/lng

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
