name: Test Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Run Backend Regression Tests
      working-directory: ./backend
      run: npm test
      env:
        JWT_SECRET: test_secret_key

  ocr-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./ocr-service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install system dependencies for OpenCV and PDF parsing
        sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx poppler-utils
        
    - name: Run OCR Resilience Tests
      working-directory: ./ocr-service
      run: pytest tests/ -v
